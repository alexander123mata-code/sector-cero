[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sector-cero"
version = "0.1.0"
description = "Comprueba que tu maquina esta lista para jugar a Sector Cero."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
sector = "sector_cero.cli:principal"

[tool.hatch.build.targets.wheel]
packages = ["src/sector_cero"]

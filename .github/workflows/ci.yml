name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Reglas del validador
        run: npm test

      # La barrera que importa: ejecuta la solucion de referencia de cada
      # mision contra sus propias pruebas. Una mision con pruebas
      # contradictorias, restricciones imposibles o un presupuesto de
      # operaciones irreal no puede llegar a main.
      - name: Validar contenido
        run: npm run validar

      - name: Build
        run: npm run build

  cli:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -e .

      # La ficha la emite Python y la lee TypeScript. Los tests de app/
      # comprueban el lado del navegador con vectores reales; estos, el del CLI.
      - name: Tests del CLI
        run: python -m unittest discover -s tests

      - name: El comando arranca
        run: sector verify --solo-ficha
